version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: crw_postgres
    environment:
      POSTGRES_USER: crw_user
      POSTGRES_PASSWORD: crw_password
      POSTGRES_DB: crw_dev
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crw_user -d crw_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crw_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://crw_user:crw_password@db:5432/crw_dev
      ENVIRONMENT: development
      PYTHONPATH: src
      ALLOWED_ORIGINS: '["http://localhost:3011", "http://127.0.0.1:3011", "http://localhost:8000", "http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: crw_frontend
    ports:
      - "3011:3000"
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:

